[package]
name = "finanzblick"
version = "0.5.2"
description = "Lokaler Multi-Bank-Aggregator für persönliche Finanzen"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "finanzblick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
calamine = { version = "0.36.1", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.12"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
encoding_rs = "0.8"
csv = "1.4"
zeroize = "1"
tempfile = "3"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
