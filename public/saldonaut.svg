<!-- Master-Asset für Brand-Header, Browser-Icon und Plattform-Icons: ein präziser Orbit als Zeichen für gebündelte Finanzwege. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.58" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.52" stop-color="#10b981"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.62" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="256" cy="256" r="88" fill="url(#planet)" stroke="#64748b" stroke-opacity="0.42" stroke-width="3"/>
  <path d="M106 303c38 57 154 72 244 31 76-35 101-96 55-132-45-35-145-28-218 15-63 37-87 85-55 117"
        fill="none" stroke="#94a3b8" stroke-opacity="0.52" stroke-width="10" stroke-linecap="round"/>
  <path d="M106 303c38 57 154 72 244 31 76-35 101-96 55-132"
        fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="405" cy="202" r="15" fill="#6ee7b7" filter="url(#glow)"/>
  <circle cx="106" cy="303" r="8" fill="#10b981"/>
</svg>
